name: Insights Analyst

# Weekly brief: computes the dashboard's figures and asks Claude to write what
# changed, what is at risk and what to do next. Only aggregate figures leave the
# runner. Needs the ANTHROPIC_API_KEY repository secret. See docs/insights.md.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Figures only, do not call Claude
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  brief:
    name: Write insights brief
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Write brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$DRY_RUN" ]; then
            echo "::error title=Missing secret::Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions, or run with dry_run."
            exit 1
          fi
          sdd-insights $DRY_RUN --out insights/brief.md --json insights/brief.json
          cat insights/brief.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: insights-brief
          path: insights/
          retention-days: 90
